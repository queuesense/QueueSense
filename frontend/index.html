<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-icon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Use the official logo as the tab icon once public/kgp-logo.png exists.
      (function () {
        var img = new Image();
        img.onload = function () {
          var l = document.getElementById('app-icon');
          l.type = 'image/png';
          l.href = '/kgp-logo.png';
        };
        img.src = '/kgp-logo.png';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIT KGP Radar</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
